[package]
name = "market-generator"
version = "0.1.0"
edition = "2024"
description = "Deterministic simulated market-update generator compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
